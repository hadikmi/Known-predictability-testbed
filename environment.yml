# conda env create -f environment.yml && conda activate knownpred
# For a CUDA build of PyTorch, follow https://pytorch.org/get-started/locally/
name: knownpred
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - xarray>=2023.6
  - netcdf4>=1.6
  - dask>=2023.6
  - zarr>=2.16
  - fsspec>=2023.6
  - aiohttp>=3.9
  - cftime>=1.6
  - requests>=2.31
  - tabulate
  - cartopy>=0.22
  - pytest>=7.4
  - ruff>=0.4
  - pytorch>=2.1
  - pip
  - pip:
      - -e .

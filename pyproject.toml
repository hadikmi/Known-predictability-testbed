[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knownpred"
version = "0.1.0"
description = "A ground-truth testbed for state-dependent predictability ('windows of opportunity') and uncertainty-aware neural networks, with a real-data application."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hadi Karimi" }]
requires-python = ">=3.10"
keywords = ["climate", "predictability", "uncertainty quantification", "neural networks", "ENSO", "explainable AI"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Hydrology",
]
# Core: everything needed for the synthetic system, ground truth, metrics and
# non-neural baselines. Kept deliberately small.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tabulate>=0.9",  # markdown tables in results/
]

[project.optional-dependencies]
# Neural networks and attribution (Part A models, Part B models)
ml = ["torch>=2.1"]
# Real-data pipeline (Part B)
data = [
  "xarray>=2023.6",
  "netCDF4>=1.6",
  "dask[array]>=2023.6",
  "zarr>=2.16",
  "fsspec>=2023.6",
  "aiohttp>=3.9",  # fsspec HTTPS reader for the public CESM2-LE Zarr stores
  "cftime>=1.6",
  "requests>=2.31",
]
dev = ["pytest>=7.4", "ruff>=0.4", "pre-commit>=3.5"]
all = ["knownpred[ml,data,dev]"]

[project.scripts]
knownpred = "knownpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
